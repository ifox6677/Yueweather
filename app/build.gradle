apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    lint {
        disable += 'MissingTranslation'
    }

    dependenciesInfo {
        // Disable including dependency metadata when building APKs
        includeInApk = false
        // Disable including dependency metadata when building Android App Bundles
        includeInBundle = false
    }

    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    namespace "org.zhangjq0908.weather"
    compileSdk 35

    defaultConfig {
        applicationId "org.zhangjq0908.weather"
        minSdk 28
        targetSdk 35
        versionCode 39
        versionName "0.6.8"

        buildConfigField "String", "BASE_URL", "\"https://api.open-meteo.com/v1/\""
        buildConfigField "String", "GITHUB_URL","\"https://github.com/ifox6677/Yueweather/\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.kotlin.stdlib
    // Compose BOM + Compose libs (replaces williamchart)
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.runtime
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.preference
    implementation libs.androidx.appcompat
    implementation libs.google.material
    implementation libs.androidx.legacy.support.v4
    implementation libs.volley
    implementation libs.androidx.recyclerview
    implementation libs.androidx.cardview
    implementation libs.osmdroid.android
    implementation libs.androidx.work.runtime

    testImplementation libs.junit
    testImplementation libs.org.json
}
